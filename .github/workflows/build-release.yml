name: Build and Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release if missing
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --draft --title "$TAG" --verify-tag --generate-notes
          fi

  windows-x64:
    name: Windows x64
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build portable ZIP
        working-directory: source
        shell: pwsh
        run: ./__assets/win/script-pack-win-zip.ps1 -Platform x64

      - name: Upload ZIP to release
        shell: pwsh
        run: gh release upload $env:TAG (Get-ChildItem source/__artifacts/bundle/*.zip).FullName --clobber

  linux-x64:
    name: Linux x64
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Build AppImage
        working-directory: source
        run: bash __assets/linux/script-pack-linux-x64-appimage.sh

      - name: Upload AppImage to release
        run: gh release upload "$TAG" source/__artifacts/bundle/*.AppImage --clobber

  publish:
    name: Publish release
    needs:
      - windows-x64
      - linux-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft
        run: gh release edit "$TAG" --draft=false
